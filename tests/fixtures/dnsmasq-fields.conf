# The full field list from dnsmasq(8):
#   <start-addr>[,<end-addr>|<mode>][,<netmask>[,<broadcast>]][,<lease time>]
# The third IP-looking token on the first line is the broadcast address, not the netmask.
dhcp-range=192.168.90.0,static,255.255.255.0,192.168.90.255
dhcp-range=192.168.91.50,192.168.91.150,255.255.255.0,192.168.91.255,12h
dhcp-range=set:guest,192.168.92.0,proxy,255.255.255.0,192.168.92.255,6h
