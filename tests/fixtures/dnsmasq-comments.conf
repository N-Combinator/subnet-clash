# Comments dnsmasq strips: the note on the right of a directive is not part of it.
dhcp-range=192.168.70.100,192.168.70.200,12h  # guest pool, keep in sync with the AP
dhcp-range=10.70.0.0,static,255.255.255.0 # tftp clients only
   # an indented whole-line comment
dhcp-range=192.168.71.10,192.168.71.50 # spare addresses, no lease time set
dhcp-range=set:"guest#1",192.168.72.10,192.168.72.20,12h  # a quoted '#' is not a comment
dhcp-option=option:router,192.168.70.1 # not a range
