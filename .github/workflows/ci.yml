name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke-test the installed entry point
        run: |
          subnet-clash --version
          subnet-clash defaults >/dev/null
          set +e
          subnet-clash check \
            --wg tests/fixtures/wg0.conf \
            --docker tests/fixtures/docker-net.json \
            --netplan tests/fixtures/01-netcfg.yaml \
            --dnsmasq tests/fixtures/dnsmasq.conf \
            --format json >/dev/null
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit code 1 for a clash, got $code"; exit 1; }

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: ls -l dist
